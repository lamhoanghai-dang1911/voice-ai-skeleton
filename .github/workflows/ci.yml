name: IX.VOICE Engineering CI Baseline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Security & Secret Hygiene Guard
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret Hygiene & Safe Env Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify no real .env or secrets are committed
        run: |
          echo "Checking for committed sensitive .env files..."
          if find . -maxdepth 3 -name ".env" -o -name "*.pem" -o -name "*.key" | grep -q .; then
            echo "ERROR: Detected sensitive file committed to repository!"
            exit 1
          fi
          echo "Secret check passed: only safe templates present."

  # ----------------------------------------------------------------------------
  # 2. Backend Unit & Canonical Contract Tests
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Lint & Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest & Canonical Contract Validation
        env:
          PIPELINE_MODE: mock
          ENVIRONMENT: test
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/tests -v --disable-warnings

  # ----------------------------------------------------------------------------
  # 3. Frontend Typecheck & Build
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck & Lint
        working-directory: frontend
        run: npm run lint

      - name: Production Build
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 4. Docker Build Smoke Test
  # ----------------------------------------------------------------------------
  docker-smoke-test:
    name: Docker Images Build Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ix-voice-backend:ci-test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: ix-voice-frontend:ci-test
