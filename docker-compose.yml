# ==============================================================================
# INTEGRIX IX.VOICE - DOCKER COMPOSE CONFIGURATION (LOCAL-FIRST RUNTIME)
# ==============================================================================
# Default execution (CPU mode):
#   docker compose up --build
#
# GPU-accelerated execution (NVIDIA CUDA):
#   docker compose --profile gpu up --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Redis - Celery Message Broker & Result Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ix-voice-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ix-voice-net

  # ----------------------------------------------------------------------------
  # 2. Backend - FastAPI API Gateway
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ix-voice-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_LOCAL_DIR=/app/data/storage
      - PIPELINE_MODE=mock
      - DEVICE=cpu
    volumes:
      - audio_storage:/app/data/storage
      - ./contracts:/app/contracts
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ix-voice-net

  # ----------------------------------------------------------------------------
  # 3. Worker (CPU Default) - Celery Speech AI Processing Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ix-voice-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-c", "2"]
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_LOCAL_DIR=/app/data/storage
      - PIPELINE_MODE=mock
      - DEVICE=cpu
    volumes:
      - audio_storage:/app/data/storage
      - ./contracts:/app/contracts
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ix-voice-net

  # ----------------------------------------------------------------------------
  # 4. Worker GPU (Optional Profile: --profile gpu)
  # ----------------------------------------------------------------------------
  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ix-voice-worker-gpu
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-c", "1"]
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_LOCAL_DIR=/app/data/storage
      - PIPELINE_MODE=real
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - audio_storage:/app/data/storage
      - ./data/models:/app/data/models
      - ./contracts:/app/contracts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ix-voice-net

  # ----------------------------------------------------------------------------
  # 5. Frontend - React + Vite (Served via Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ix-voice-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ix-voice-net

networks:
  ix-voice-net:
    driver: bridge

volumes:
  redis_data:
  audio_storage:
